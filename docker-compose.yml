version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: emosense-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - emosense-network

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: emosense-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - emosense-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emosense-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/emosense
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=emosense_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ai-service
    networks:
      - emosense-network

volumes:
  mongo-data:

networks:
  emosense-network:
    driver: bridge
