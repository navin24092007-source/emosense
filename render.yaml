services:
  # ------------------------------------------------
  # 1. AI Service (Python FastAPI)
  # ------------------------------------------------
  - type: web
    name: emosense-ai-service
    env: docker
    rootDir: ai_service
    plan: starter # Needs at least starter for memory (512MB RAM might be tight, Standard is recommended)
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  # ------------------------------------------------
  # 2. Backend API (Node.js)
  # ------------------------------------------------
  - type: web
    name: emosense-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false # You must set this manually in the Render Dashboard to your MongoDB Atlas URL
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 256-bit string
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: emosense-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLIENT_URL
        sync: false # You must set this manually to your Vercel URL (e.g., https://emosense.vercel.app)
